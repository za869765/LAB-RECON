<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>檢驗對帳計算器 v1.4.6 — 臺南市佳里區衛生所</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei','PingFang TC',-apple-system,sans-serif;background:#eceff1;color:#1e2a38;line-height:1.5;padding:20px;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
header{background:linear-gradient(135deg,#37474f,#1e2a38);color:#fff;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;font-weight:700;letter-spacing:.5px}
header .ver{font-size:11px;opacity:.7;letter-spacing:1px}
main{padding:24px}
section{margin-bottom:24px}
.sec-hd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#37474f;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #cfd8dc}
.sec-hd .num{display:inline-flex;width:22px;height:22px;background:#1565c0;color:#fff;border-radius:50%;align-items:center;justify-content:center;font-size:11px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:8px}
.slot{border:2px dashed #cfd8dc;border-radius:10px;padding:18px 16px 14px;background:#fafbfc;transition:all .2s;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:180px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.slot:hover,.slot.drag{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.slot input{display:none}
.slot.t-central{border-color:#81d4fa;background:#f3fbfe}
.slot.t-central:hover,.slot.t-central.drag{border-color:#0277bd;background:#e1f5fe}
.slot.t-billing{border-color:#ffcc80;background:#fff8f0}
.slot.t-billing:hover,.slot.t-billing.drag{border-color:#ef6c00;background:#fff3e0}
.slot.t-internal{border-color:#ce93d8;background:#fbf6fd}
.slot.t-internal:hover,.slot.t-internal.drag{border-color:#6a1b9a;background:#f3e5f5}
.slot.done{border-style:solid;border-color:#43a047;background:#f1f8e9}
.slot.error{border-style:solid;border-color:#e53935;background:#ffebee}
.slot .slot-tag{align-self:flex-start;margin-bottom:8px}
.slot .slot-icon{font-size:32px;margin:6px 0;color:#90a4ae}
.slot.done .slot-icon{color:#43a047}
.slot.error .slot-icon{color:#c62828}
.slot .name{font-size:12px;color:#37474f;word-break:break-all;font-weight:600;margin-top:4px}
.slot .status{font-size:11px;margin-top:6px;color:#78909c;line-height:1.5}
.slot.done .status{color:#2e7d32;font-weight:600}
.slot.error .status{color:#c62828;font-weight:600}
.slot .pick-hint{font-size:11px;color:#90a4ae;margin-top:6px}
.slot.done .pick-hint, .slot.error .pick-hint{display:none}
.btn{padding:10px 20px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#1565c0;color:#fff}
.btn-primary:hover{background:#0d47a1}
.btn-primary:disabled{background:#b0bec5;cursor:not-allowed}
.btn-success{background:#2e7d32;color:#fff}
.btn-success:hover{background:#1b5e20}
.btn-ghost{background:#fff;color:#546e7a;border:1px solid #cfd8dc}
.btn-ghost:hover{background:#f5f7f9}
.summary-bar{background:linear-gradient(135deg,#37474f,#455a64);color:#fff;padding:14px 18px;border-radius:8px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;margin-bottom:14px}
.summary-bar .item{display:flex;flex-direction:column;gap:2px}
.summary-bar .lbl{font-size:10px;opacity:.7;letter-spacing:1px}
.summary-bar .val{font-size:18px;font-weight:700}
.summary-bar .val.green{color:#a5d6a7}
.summary-bar .val.red{color:#ef9a9a}
.mdbox{border:1px solid #ffe0b2;background:#fffaf3;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.mdbox .mdhead{font-size:12px;font-weight:700;color:#e65100;margin-bottom:8px}
.mdchips{display:flex;flex-wrap:wrap;gap:8px}
.mdchip{padding:6px 13px;border:1px solid #cfd8dc;border-radius:20px;background:#fff;cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums;color:#546e7a;transition:all .12s;font-family:inherit}
.mdchip:hover{border-color:#ef6c00;background:#fff3e0}
.mdchip.on{background:#fff3e0;border-color:#ef6c00;color:#e65100;font-weight:700;box-shadow:0 1px 3px rgba(239,108,0,.25)}
.mdnote{margin-top:9px;font-size:11px;color:#bf360c;background:#fff3e0;border-radius:4px;padding:6px 9px;line-height:1.6}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
table th{background:#37474f;color:#fff;padding:7px 8px;text-align:left;font-weight:600;font-size:11px;letter-spacing:.5px;border:1px solid #455a64}
table td{padding:5px 8px;border:1px solid #e0e0e0}
table tr:nth-child(even) td{background:#fafbfc}
table tr.total td{background:#fff8e1!important;font-weight:700;border-top:2px solid #ffa000}
.num-cell{text-align:right;font-variant-numeric:tabular-nums}
.code-cell{font-family:'Consolas',monospace;color:#1565c0;font-weight:600}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.verify-section{margin-top:14px}
.issue{padding:9px 12px;border-radius:6px;margin-bottom:6px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.issue .lvl{font-weight:700;flex-shrink:0;min-width:62px}
.issue .cat{color:#546e7a;font-size:11px;flex-shrink:0;min-width:120px}
.issue .msg{flex:1;color:#37474f}
.issue.error{background:#ffebee;border-left:3px solid #c62828}
.issue.error .lvl{color:#c62828}
.issue.warn{background:#fff8e1;border-left:3px solid #ff9800}
.issue.warn .lvl{color:#e65100}
.issue.info{background:#e3f2fd;border-left:3px solid #1565c0}
.issue.info .lvl{color:#1565c0}
.pass{background:#e8f5e9;border-left:3px solid #2e7d32;padding:9px 12px;border-radius:6px;font-size:12px;color:#2e7d32;font-weight:600;margin-bottom:6px}
.verdict{padding:12px 14px;border-radius:8px;margin-bottom:10px;font-size:14px;font-weight:700}
.verdict.ok{background:#e8f5e9;color:#1b5e20;border:1px solid #66bb6a}
.verdict.bad{background:#ffebee;color:#b71c1c;border:1px solid #ef5350}
.verdict.note{background:#fff8e1;color:#e65100;border:1px solid #ffb74d}
.notes{font-size:11px;color:#78909c;margin-top:8px;line-height:1.6}
.hidden{display:none}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.3px}
.tag.central{background:#e1f5fe;color:#0277bd}
.tag.billing{background:#fff3e0;color:#ef6c00}
.tag.internal{background:#f3e5f5;color:#6a1b9a}
.foot{padding:14px 26px;background:#fafbfc;border-top:1px solid #e0e0e0;font-size:11px;color:#78909c;text-align:center}
@media(max-width:640px){
  body{padding:10px}
  main{padding:16px}
  .summary-bar{gap:14px}
  .summary-bar .val{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🧪 檢驗對帳計算器 — 臺南市佳里區衛生所</h1>
  <span class="ver">v1.4.6</span>
</header>
<main>

<section>
  <div class="sec-hd"><span class="num">1</span>分別拖放 3 個檔案到對應格子（或點格子選檔），3 份齊全會自動跑</div>
  <div class="slots">
    <label class="slot t-central" id="slot-central">
      <span class="tag central slot-tag">①中央健保申報明細</span>
      <div class="slot-icon">📂</div>
      <div class="name">尚未上傳</div>
      <div class="status">中央健保申報明細.XLS</div>
      <div class="pick-hint">點此選檔 / 拖曳進來</div>
      <input type="file" data-type="central" accept=".xls,.xlsx,.XLS,.XLSX">
    </label>
    <label class="slot t-billing" id="slot-billing">
      <span class="tag billing slot-tag">②客戶對帳單</span>
      <div class="slot-icon">📂</div>
      <div class="name">尚未上傳</div>
      <div class="status">客戶對帳單明細.XLS</div>
      <div class="pick-hint">點此選檔 / 拖曳進來</div>
      <input type="file" data-type="billing" accept=".xls,.xlsx,.XLS,.XLSX">
    </label>
    <label class="slot t-internal" id="slot-internal">
      <span class="tag internal slot-tag">③常誠檢驗交付表EN220</span>
      <div class="slot-icon">📂</div>
      <div class="name">尚未上傳</div>
      <div class="status">常誠EN220交付檢驗統計表.XLS</div>
      <div class="pick-hint">點此選檔 / 拖曳進來</div>
      <input type="file" data-type="internal" accept=".xls,.xlsx,.XLS,.XLSX">
    </label>
  </div>
  <div class="actions" style="margin-top:14px">
    <button class="btn btn-ghost" id="resetBtn">↺ 全部重來</button>
  </div>
  <div class="notes">
    3 份檔案上齊後自動產製 + 校對。檔案類型會自動辨識，拖錯格子也沒關係。
  </div>
</section>

<section id="resultSection" class="hidden">
  <div class="sec-hd"><span class="num">2</span>結果（即時更新）</div>
  <div class="summary-bar" id="summaryBar"></div>
  <div class="mdbox hidden" id="mobileDateBox"></div>

  <h3 style="font-size:13px;font-weight:700;color:#37474f;margin-bottom:8px">📊 檢驗總表</h3>
  <div style="overflow-x:auto;border:1px solid #cfd8dc;border-radius:6px">
    <table id="resultTable"></table>
  </div>
  <div class="actions">
    <button class="btn btn-success" id="downloadBtn">📥 下載 檢驗總表-YYYMM.xlsx</button>
  </div>

  <h3 style="font-size:13px;font-weight:700;color:#37474f;margin:18px 0 8px">📋 其他對帳表項目（同廠商，不列入上表檢驗總表）</h3>
  <div id="otherTableBox" style="border:1px solid #cfd8dc;border-radius:6px;padding:12px;background:#fbf6fd;font-size:12px;color:#37474f"></div>

  <h3 style="font-size:13px;font-weight:700;color:#37474f;margin:18px 0 8px">🔍 校對結果</h3>
  <div id="verifyResult" class="verify-section"></div>
</section>

</main>
<div class="foot">單檔離線 HTML — 資料完全在你的瀏覽器本機處理，不上傳任何檔案到外部</div>
</div>

/* ═══════════════════════════════════════════════════════
   檔案類型偵測
═══════════════════════════════════════════════════════ */
function detectFileType(workbook){
  const ws = workbook.Sheets[workbook.SheetNames[0]];
  const a1 = String((ws['A1']||{}).v||'');
  if (a1.includes('中央健保申報')) return 'central';
  if (a1.includes('客戶帳單明細'))  return 'billing';
  if (a1 === '筆數' || (ws['A1']&&ws['A1'].v==='筆數')) return 'internal';
  /* 退路：檢查欄位 */
  const headers = [];
  for(let c=1;c<=12;c++){
    const cell = ws[XLSX.utils.encode_cell({r:0,c:c-1})];
    if(cell) headers.push(String(cell.v||''));
  }
  const hStr = headers.join('|');
  if (hStr.includes('健保代號')||hStr.includes('檢驗名稱')) return 'internal';
  if (hStr.includes('檢體編號')||hStr.includes('健保價格')) return 'central';
  return 'unknown';
}

/* ═══════════════════════════════════════════════════════
   解析：央保申報對單
═══════════════════════════════════════════════════════ */
function parseCentral(ws){
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});
  const items=[],dailySubs=[];
  let total={cost:0,decl:0},month=null,clinic=null,curDate=null,inSection=false;
  /* v1.4.1：依「表頭名稱」動態對欄。
     央保報表 115/6 起新增「健保代碼」欄，標準價格/健保價格整個右移一格，
     舊版寫死 r[5]=成本 r[6]=健保 會把代碼文字當金額(→NaN→0)、連客戶統計也讀不到 → 全部 0。
     舊格式預設(無代碼欄)：大項=D(3) 項目=E(4) 標準價=F(5) 健保價=G(6) */
  let COL={big:3,sub:4,code:null,cost:5,decl:6};
  const hasLabel=(r,label)=> r.some(c=>String(c==null?'':c).trim()===label);
  for(const r of rows){
    if(!r||!r.length) continue;
    const a=String(r[0]||'').trim();
    /* 第一列「客戶簡稱: 臺南市佳里區衛生所」 */
    if(a.startsWith('客戶簡稱')){
      const m=a.match(/客戶簡稱:\s*(.+)/);
      if(m) clinic=m[1].trim();
      continue;
    }
    if(a.startsWith('單據日期:')){
      curDate=a.replace('單據日期:','').trim();
      if(!month){
        const m=curDate.match(/^(\d+)\/(\d+)\/\d+/);
        if(m) month=m[1]+m[2].padStart(2,'0');
      }
      inSection=false; continue;
    }
    if(a==='檢體編號'){
      /* 依表頭重建欄位對照（找不到的維持預設值） */
      r.forEach((h,idx)=>{
        const hh=String(h==null?'':h).trim();
        if(hh==='檢體大項簡稱') COL.big=idx;
        else if(hh==='檢體項目簡稱') COL.sub=idx;
        else if(hh==='健保代碼'||hh==='健保代號') COL.code=idx;
        else if(hh==='標準價格') COL.cost=idx;
        else if(hh==='健保價格') COL.decl=idx;
      });
      inSection=true; continue;
    }
    if(hasLabel(r,'每日小計:')){ dailySubs.push({date:curDate,cost:+r[COL.cost]||0,decl:+r[COL.decl]||0}); inSection=false; continue; }
    if(hasLabel(r,'客戶統計:')){ total={cost:+r[COL.cost]||0,decl:+r[COL.decl]||0}; continue; }
    if(inSection&&a){
      const sub=String(r[COL.sub]||'').trim(), big=String(r[COL.big]||'').trim();
      let code=null;
      /* 新格式：直接讀「健保代碼」欄 */
      if(COL.code!=null){
        const cc=String(r[COL.code]==null?'':r[COL.code]).trim().toUpperCase();
        if(/^[A-Z0-9]{4,8}$/.test(cc)) code=cc;
      }
      /* 舊格式 fallback：代碼藏在大項名稱括號內或靠名稱對照 */
      if(!code){
        if(sub==='單價'){
          const m=big.match(/\(([A-Z]\d{4}[A-Z])\)/);
          if(m) code=m[1];
          else if(big==='尿液常規檢查') code='06012C';
          else if(big==='血液常規檢查') code='08011C';
          else if(big.includes('成人預防保健')) code='21013C';
        } else {
          code = NAME_TO_CODE[sub] || null;
        }
      }
      items.push({date:curDate,sn:r[0],name:r[1],id:r[2],big,sub,cost:+r[COL.cost]||0,decl:+r[COL.decl]||0,code});
    }
  }
  return {items,dailySubs,total,month};
}

/* ═══════════════════════════════════════════════════════
   解析：客戶帳單明細
═══════════════════════════════════════════════════════ */
function parseBilling(ws){
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});
  let total=0;
  const visits=[]; let cur=null;
  for(const r of rows){
    if(!r||!r.length) continue;
    const a=String(r[0]||'').trim(), b=String(r[1]||'').trim();
    /* R2 第二格是金額 */
    if(a.startsWith('應收金額')){ total = +r[1]||0; continue; }
    if(/^\d+\/\d+\/\d+/.test(a)){
      cur={date:a,name:r[1],id:r[2],idLong:r[3],amount:+r[4]||0,itemsText:''};
      visits.push(cur);
    } else if(cur && b && !a){
      cur.itemsText = b;
    }
  }
  return {total,visits};
}

/* ═══════════════════════════════════════════════════════
   解析：內部統計表 (11504.xlsx 交付檢驗統計表)
═══════════════════════════════════════════════════════ */
function parseInternal(ws){
  const rows = XLSX.utils.sheet_to_json(ws,{defval:null,raw:false});
  const items = rows
    .filter(r=>r['健保代號']&&r['檢驗名稱'])
    .map(r=>{
      const raw = String(r['健保代號']).trim();
      /* v1.0.1：短碼自動正規化成央保長碼，避免「21 vs 21013C」誤判 */
      const code = INTERNAL_CODE_ALIASES[raw] || raw;
      return {
        seq:r['筆數'],mrn:r['病歷號'],name:r['姓名'],
        code, rawCode: raw,
        testName:r['檢驗名稱'],
        visitNo:r['就醫序號'],date:r['就醫日期'],
        qty:+(r['次數']||1),
        price:+(r['健保單價']||0),
        amount:+(r['小計']||0),
        doctor:r['醫師'],
      };
    });
  return {items};
}

/* ═══════════════════════════════════════════════════════
   聚合 + 產製 檢驗總表
═══════════════════════════════════════════════════════ */
function aggregateByCode(centralItems){
  const agg = new Map();
  for(const it of centralItems){
    if(!it.code) continue;
    if(!agg.has(it.code)) agg.set(it.code,{code:it.code,qty:0,costSum:0,declSum:0,prices:new Set(),examples:[]});
    const a = agg.get(it.code);
    a.qty++;
    a.costSum += it.cost;
    a.declSum += it.decl;
    a.prices.add(`${it.cost}/${it.decl}`);
    a.examples.push(it);
  }
  return agg;
}
function buildSummary(agg, selfPay){
  const SP = (selfPay && selfPay.byCode) || {};   // v1.4.6 淨付額扣自費
  const items=[];
  const codes=[...agg.keys()].sort((a,b)=>{
    const aN=/^\d/.test(a), bN=/^\d/.test(b);
    if(aN!==bN) return aN?-1:1;
    return a.localeCompare(b);
  });
  for(const code of codes){
    const a = agg.get(code);
    const decl = a.qty>0 ? Math.round(a.declSum/a.qty) : 0;
    const cost = a.qty>0 ? Math.round(a.costSum/a.qty) : 0;
    items.push({
      code, name: CODE_TO_NAME[code] || code,
      decl, cost, qty: a.qty,
      declTotal: a.declSum, costTotal: a.costSum,
      net: a.declSum - a.costSum - (SP[code]||0),
    });
  }
  return items;
}

/* v1.4.4：自費金額歸戶 — 把客戶帳單裡「不在健保申報」的項目(=自費)依檢驗代碼歸位。
   逐張帳單 visit：用項目名稱對到代碼，扣掉該人健保有 cover 的成本，餘額=自費，
   分攤到此 visit 不在該人健保申報的代碼上。回 {byCode:{code:金額}, total} */
function computeSelfPay(central, billing){
  const byCode={}; let total=0;
  if(!central || !billing) return {byCode, total};
  const costOf = c => (STANDARD_PRICES[c] && STANDARD_PRICES[c].cost) || 0;
  /* 每人：健保成本、健保代碼集合、帳單總額、帳單項目文字 */
  const cenCost={}, cenCodes={}, billAmt={}, billTxt={};
  for(const it of central.items){
    if(!it.name) continue;
    cenCost[it.name]=(cenCost[it.name]||0)+(+it.cost||0);
    if(it.code)(cenCodes[it.name]=cenCodes[it.name]||new Set()).add(it.code);
  }
  for(const v of (billing.visits||[])){
    if(!v.name) continue;
    billAmt[v.name]=(billAmt[v.name]||0)+(+v.amount||0);
    billTxt[v.name]=(billTxt[v.name]||'')+' '+String(v.itemsText||'');
  }
  /* 逐人：自費 = 帳單 − 健保（跟「校對」用同一個可靠的金額差），再把這筆差額對到代碼 */
  for(const name in billAmt){
    const D = Math.round(billAmt[name] - (cenCost[name]||0));
    if(D <= 0.5) continue;        // 帳單沒比健保多 → 沒自費
    total += D;
    const cen = cenCodes[name] || new Set();
    /* (1) 先用帳單項目名稱找「不在健保申報」的代碼 */
    let self = [];
    for(const nm in NAME_TO_CODE){
      const c = NAME_TO_CODE[nm];
      if(nm && billTxt[name].includes(nm) && !cen.has(c) && !self.includes(c)) self.push(c);
    }
    /* (2) 名稱對不到 → 用「單價剛好等於差額」的代碼猜（自費通常一支、單價=差額） */
    if(!self.length){
      const hit = Object.keys(STANDARD_PRICES).filter(c => !cen.has(c) && costOf(c) === D);
      if(hit.length === 1) self = [hit[0]];
    }
    if(self.length){
      const w = self.map(c => costOf(c) || 1);
      const wsum = w.reduce((s,x)=>s+x,0) || 1;
      self.forEach((c,i)=>{ byCode[c]=(byCode[c]||0)+D*w[i]/wsum; });
    } else {
      byCode['（自費）']=(byCode['（自費）']||0)+D;   // 真的對不出代碼，至少入總額
    }
  }
  for(const c in byCode) byCode[c]=Math.round(byCode[c]);
  return {byCode, total: Math.round(total)};
}

/* ═══════════════════════════════════════════════════════
   校對：6 項檢查
═══════════════════════════════════════════════════════ */
function runVerification(central, billing, internal, agg){
  const issues = [];
  const passes = [];

  /* 1. 央保 客戶統計 = 每日小計 加總 */
  const dCost = central.dailySubs.reduce((s,d)=>s+d.cost,0);
  const dDecl = central.dailySubs.reduce((s,d)=>s+d.decl,0);
  const okC = Math.abs(dCost - central.total.cost)<.5;
  const okD = Math.abs(dDecl - central.total.decl)<.5;
  if(okC && okD) passes.push(`健保申報表 金額前後一致（總計 $${central.total.cost}）`);
  if(!okC) issues.push({level:'error',cat:'健保申報表自我檢查',msg:`申報表「客戶統計」是 $${central.total.cost}，但每天小計加起來是 $${dCost}（差 $${central.total.cost-dCost}）—— 申報表本身就兜不攏，可能下載到不完整的檔`});
  if(!okD) issues.push({level:'error',cat:'健保申報表自我檢查',msg:`申報表健保價總計 $${central.total.decl}，但每天小計加起來 $${dDecl}（差 $${central.total.decl-dDecl}）—— 申報表本身兜不攏`});

  /* 2. 央保 每日小計 = 該日逐筆加總 */
  const byDate = new Map();
  for(const it of central.items){
    if(!byDate.has(it.date)) byDate.set(it.date,{cost:0,decl:0,n:0});
    const d=byDate.get(it.date);
    d.cost+=it.cost; d.decl+=it.decl; d.n++;
  }
  let dailyOk = true;
  for(const sub of central.dailySubs){
    const d = byDate.get(sub.date) || {cost:0,decl:0};
    if(Math.abs(d.cost-sub.cost)>.5){
      issues.push({level:'error',cat:'健保申報表每天小計',msg:`${sub.date} 當天小計 $${sub.cost}，但當天逐筆加起來 $${d.cost}（差 $${sub.cost-d.cost}）`});
      dailyOk=false;
    }
    if(Math.abs(d.decl-sub.decl)>.5){
      issues.push({level:'error',cat:'健保申報表每天小計',msg:`${sub.date} 當天健保小計 $${sub.decl}，但逐筆加起來 $${d.decl}（差 $${sub.decl-d.decl}）`});
      dailyOk=false;
    }
  }
  if(dailyOk) passes.push(`健保申報表 每天小計都正確`);

  /* 3. 客戶帳單應收金額 = 央保客戶統計（標準價） */
  if(billing){
    const billDiff = billing.total - central.total.cost;
    if(Math.abs(billDiff)<.5){
      passes.push(`客戶帳單金額 = 健保申報金額（都是 $${billing.total}）`);
    } else {
      /* v1.4.2：逐人比對找差額來源。帳單比央保多 = 自費候選（自費不進健保申報）；央保多 = 可能漏收要查 */
      const cenBy={}, billBy={};
      for(const it of central.items){ if(it.name) cenBy[it.name]=(cenBy[it.name]||0)+(+it.cost||0); }
      for(const v of billing.visits){ if(v.name) billBy[v.name]=(billBy[v.name]||0)+(+v.amount||0); }
      const pos=[], neg=[];
      for(const n of new Set([...Object.keys(cenBy),...Object.keys(billBy)])){
        const d=(billBy[n]||0)-(cenBy[n]||0);
        if(d>0.5) pos.push(`${n}（多 $${d}）`);
        else if(d<-0.5) neg.push(`${n}（少 $${-d}）`);
      }
      if(billDiff>0 && neg.length===0){
        issues.push({level:'warn',cat:'帳單比申報多（多半是自費）',msg:`客戶帳單比健保申報多 $${billDiff} —— 通常是自費項目（自費不進健保申報）。可能是：${pos.join('、')||'—'}。確認是自費就正常，不是才要查。`});
      } else {
        issues.push({level:'error',cat:'帳單對健保申報',msg:`客戶帳單 $${billing.total} 對健保申報 $${central.total.cost}（差 $${billDiff>0?'+':''}${billDiff}）。${pos.length?'帳單多（可能自費）：'+pos.join('、')+'。':''}${neg.length?'健保申報多（可能漏收，要查）：'+neg.join('、')+'。':''}`});
      }
    }
    /* 4. 客戶帳單 visits 加總 */
    const visitSum = billing.visits.reduce((s,v)=>s+v.amount,0);
    if(Math.abs(visitSum - billing.total)<.5){
      passes.push(`客戶帳單 各筆加起來 = 應收總額（${billing.visits.length} 人）`);
    } else {
      issues.push({level:'warn',cat:'客戶帳單自我檢查',msg:`帳單各筆加起來 $${visitSum}，但應收總額寫 $${billing.total}（差 $${billing.total-visitSum}）`});
    }
  }

  /* 5. 央保 vs 內部：每代碼數量比對 */
  if(internal){
    const intCount = new Map();
    for(const it of internal.items){
      intCount.set(it.code, (intCount.get(it.code)||0) + (it.qty||1));
    }
    const cenCount = new Map();
    for(const it of central.items){
      if(it.code) cenCount.set(it.code, (cenCount.get(it.code)||0)+1);
    }
    const allCodes = new Set([...intCount.keys(), ...cenCount.keys()]);
    let qtyOk = true;
    for(const code of allCodes){
      const c = cenCount.get(code)||0;
      const i = intCount.get(code)||0;
      if(c === i) continue;
      qtyOk=false;
      const name = CODE_TO_NAME[code] || code;
      if(c > i){
        /* 廠商多算 — 紅色嚴重 */
        issues.push({level:'error',cat:'筆數對不上',msg:`${name}（${code}）：健保申報 ${c} 筆，但內部只有 ${i} 筆 —— 廠商多報 ${c-i} 筆，你會多付，要查證`});
      } else if(i > 0 && c === 0){
        /* 內部有但央保沒收 — 已知代碼不重複報，移到下方「其他項目」獨立區塊；未知代碼才提示 */
        if(NON_LAB_HINTS[code]) continue;
        issues.push({level:'info',cat:'不在這張表',msg:`${name}（${code}）：內部有 ${i} 筆，這張對帳表沒有 —— 應該屬別張表或別單位（如成人預防保健、腸篩等），不是錯`});
      } else {
        /* 廠商漏算（內部多） — 黃色警示，對你有利但仍提醒 */
        issues.push({level:'warn',cat:'筆數對不上',msg:`${name}（${code}）：健保申報 ${c} 筆，內部有 ${i} 筆 —— 廠商少報 ${i-c} 筆（少報對你有利，但建議確認）`});
      }
    }
    if(qtyOk) passes.push(`每個檢驗項目筆數：健保申報 = 內部統計`);
  }

  /* 6. 單價跑掉檢查（同月內不同筆出現不同價格）*/
  let priceOk = true;
  for(const [code,a] of agg){
    if(a.prices.size > 1){
      issues.push({level:'error',cat:'同項目價格不一致',msg:`${CODE_TO_NAME[code]||code}（${code}）：同一項出現 ${a.prices.size} 種價格（${[...a.prices].join(' / ')}）—— 應該都一樣`});
      priceOk=false;
    }
  }
  if(priceOk) passes.push(`同一檢驗項目單價一致`);

  /* 7. 契約標準價格 校對 — 每項 央保價 vs 115 年度合約標準 */
  let stdOk = true;
  let stdNotInTable = [];
  for(const [code,a] of agg){
    /* 央保的價（每筆都一樣才會走到這） */
    const sample = a.examples[0];
    const cCost = sample.cost;     // 廠商申報之檢驗項目單價（成本）
    const cDecl = sample.decl;     // 健保支付點數
    const std = STANDARD_PRICES[code];
    if(!std){
      stdNotInTable.push(code);
      continue;
    }
    const costDiff = cCost - std.cost;
    const declDiff = cDecl - std.decl;
    if(costDiff !== 0 || declDiff !== 0){
      const parts = [];
      if(costDiff !== 0) parts.push(`廠商報的單價 $${cCost}，合約標準 $${std.cost} —— 廠商${costDiff>0?'多收':'少收'} $${Math.abs(costDiff)}${costDiff>0?'，要扣回':'（對你有利）'}`);
      if(declDiff !== 0) parts.push(`健保點數 ${cDecl}，標準應為 ${std.decl}`);
      const lvl = (costDiff > 0) ? 'error' : 'warn';   /* 廠商收高 = 紅；收低 = 黃 */
      issues.push({level:lvl,cat:'單價不符合約',msg:`${CODE_TO_NAME[code]||std.name}（${code}）：${parts.join('；')}`});
      stdOk = false;
    }
  }
  if(stdNotInTable.length){
    issues.push({level:'info',cat:'無合約標準可比',msg:`這些代碼不在合約標準價表，沒辦法比對：${stdNotInTable.join('、')}`});
  }
  if(stdOk && stdNotInTable.length===0){
    passes.push(`每項檢驗單價都符合合約標準`);
  } else if(stdOk){
    passes.push(`合約表內項目單價都符合（另有 ${stdNotInTable.length} 項無標準可比）`);
  }

  return {issues, passes};
}

/* ═══════════════════════════════════════════════════════
   產出 xlsx
═══════════════════════════════════════════════════════ */
/* v1.3.2：用 ExcelJS 產出有完整樣式的 A4 橫式檢驗總表 */
async function generateXlsxStyled(month, summary){
  const wb = new ExcelJS.Workbook();
  wb.creator = 'LAB-RECON 檢驗對帳計算器';
  wb.created = new Date();
  const yyy = month.slice(0,3), mm = String(parseInt(month.slice(3))).padStart(2,'0');
  const FONT = '微軟正黑體';
  const ws = wb.addWorksheet('檢驗總表', {
    pageSetup:{
      paperSize:9, orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:1,
      horizontalCentered:true,
      margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.3,footer:0.3}
    },
  });

  /* 欄寬（不用 key，免和 column letter 衝突） */
  ws.columns = [
    {width:12},{width:12},{width:38},{width:10},{width:10},
    {width:8},{width:10},{width:14},{width:14},{width:14},
  ];

      left:thinBorder('FFFFB74D'), right:thinBorder('FFFFB74D'),

  /* 凍結窗格 — 表頭固定（前 5 列） */
  ws.views = [{state:'frozen', ySplit:5}];
  /* 列印每頁重複表頭 */
  ws.pageSetup.printTitlesRow = '1:5';

  return await wb.xlsx.writeBuffer();
}

async function downloadXlsx(){
  if(!STATE.summary){ alert('請先上傳 3 份檔案'); return; }
  if(typeof ExcelJS === 'undefined'){
    alert('❌ ExcelJS 未載入（網路問題或被封鎖）— 改用無樣式版下載');
    /* fallback：用 SheetJS 純文字版（沒樣式但至少有資料） */
    const wb = XLSX.utils.book_new();
    const aoa = [
      [null,'臺南市佳里區衛生所'],
      [null,`${STATE.month.slice(0,3)} 年 ${parseInt(STATE.month.slice(3))} 月　檢驗總表`],
      ['檢驗代碼','申報代碼','檢驗名稱','申報額','單價','數量','自費額','申報總額','成本總額','淨付額'],
    ];
    for(const it of STATE.summary){
      aoa.push([it.code,it.code,it.name,it.decl,it.cost,it.qty,((STATE.selfPay&&STATE.selfPay.byCode[it.code])||0),it.decl*it.qty,it.cost*it.qty,(it.decl-it.cost)*it.qty-((STATE.selfPay&&STATE.selfPay.byCode[it.code])||0)]);
    }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, '工作表1');
    XLSX.writeFile(wb, `檢驗總表-${STATE.month}.xlsx`);
    return;
  }
  try {
    const buffer = await generateXlsxStyled(STATE.month, STATE.summary);
    const blob = new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `檢驗總表-${STATE.month}.xlsx`;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    console.log('[LAB-RECON] ✓ ExcelJS 美化版下載完成', `檢驗總表-${STATE.month}.xlsx`);
  } catch(e) {
    console.error('[LAB-RECON] ExcelJS 產製失敗', e);
    alert('產製失敗：'+e.message);
  }
}

const STATE = { central:null, billing:null, internal:null, summary:null, month:null,
  mobileDates:new Set(),  // v1.4.0：行動醫院日（杏仁診所，整日排除不計入）
  filtered:null };        // 套用行動醫院排除後的 central/billing/internal 視圖

function fmt(n){
  if(n==null||isNaN(n)) return '-';
  return Math.round(n).toLocaleString('zh-TW');
}

/* ═══════════════════════════════════════════════════════
   v1.4.0：行動醫院日排除
   標記某日為「行動醫院日」= 該日檢體送杏仁診所（非尚捷/常誠），
   整日所有筆數從檢驗總表、下載檔、各項校對全部排除，
   並把央保客戶統計 / 客戶帳單應收的 baseline 同步扣掉該日金額，
   避免「央保自身對帳」誤判失敗。
═══════════════════════════════════════════════════════ */
/* 三檔出現過的所有日期（聯集，已上傳者才算） */
function getAllWorkDates(){
  const set = new Set();
  if(STATE.central){
    STATE.central.dailySubs.forEach(d=>d.date && set.add(d.date));
    STATE.central.items.forEach(it=>it.date && set.add(it.date));
  }
  if(STATE.internal) STATE.internal.items.forEach(it=>it.date && set.add(it.date));
  if(STATE.billing)  STATE.billing.visits.forEach(v=>v.date && set.add(v.date));
  return [...set].sort();   // 115/05/07 為零補位格式，字串排序即正確
}
/* 各檔該行動醫院日被排除的筆數（給 UI 提示用） */
function countExcluded(){
  const mob = STATE.mobileDates;
  const c = STATE.central  ? STATE.central.items.filter(it=>mob.has(it.date)).length  : 0;
  const i = STATE.internal ? STATE.internal.items.filter(it=>mob.has(it.date)).length : 0;
  const b = STATE.billing  ? STATE.billing.visits.filter(v=>mob.has(v.date)).length   : 0;
  return {c,i,b};
}
/* 套用排除，回傳過濾後（且 baseline 已調整）的 central/billing/internal 視圖 */
function buildFilteredData(){
  const mob = STATE.mobileDates;
  let central = STATE.central, billing = STATE.billing, internal = STATE.internal;
  if(mob.size && central){
    const exSubs = central.dailySubs.filter(d=>mob.has(d.date));
    const exCost = exSubs.reduce((s,d)=>s+d.cost,0);
    const exDecl = exSubs.reduce((s,d)=>s+d.decl,0);
    central = {
      ...central,
      items: central.items.filter(it=>!mob.has(it.date)),
      dailySubs: central.dailySubs.filter(d=>!mob.has(d.date)),
      total: {cost: central.total.cost - exCost, decl: central.total.decl - exDecl},
    };
  }
  if(mob.size && billing){
    const exAmt = billing.visits.filter(v=>mob.has(v.date)).reduce((s,v)=>s+v.amount,0);
    billing = {...billing, visits: billing.visits.filter(v=>!mob.has(v.date)), total: billing.total - exAmt};
  }
  if(mob.size && internal){
    internal = {...internal, items: internal.items.filter(it=>!mob.has(it.date))};
  }
  return {central, billing, internal};
}
/* 渲染行動醫院日選擇器（自動偵測日期鈕） */
function renderMobileDates(){
  const box = document.getElementById('mobileDateBox');
  if(!box) return;
  const dates = getAllWorkDates();
  if(!dates.length){ box.classList.add('hidden'); box.innerHTML=''; return; }
  box.classList.remove('hidden');
  const chips = dates.map(d=>{
    const on = STATE.mobileDates.has(d);
    return `<button type="button" class="mdchip${on?' on':''}" data-date="${d}">${on?'🚐 ':''}${d}</button>`;
  }).join('');
  let note = '';
  if(STATE.mobileDates.size){
    const {c,i,b} = countExcluded();
    note = `<div class="mdnote">🚐 已排除行動醫院日 ${[...STATE.mobileDates].sort().join('、')}（杏仁診所，非尚捷/常誠）：央保 ${c} 筆、內部 ${i} 筆、客戶帳單 ${b} 筆 — 不列入檢驗總表與校對</div>`;
  }
  box.innerHTML = `<div class="mdhead">🚐 行動醫院日（點日期＝該日送杏仁診所，整日排除不計入）</div>
    <div class="mdchips">${chips}</div>${note}`;
}

/* v1.2.0：其他對帳表項目（85/3F 同廠商不同申報、E4004C 不同廠商僅費用） */
function buildOtherTableSummary(){
  const internal = (STATE.filtered && STATE.filtered.internal) || STATE.internal;
  if(!internal) return [];
  const out = [];
  for(const code of Object.keys(NON_LAB_HINTS)){
    if(OTHER_TABLE_HIDE[code]) continue;   // v1.4.3：IGRA 等不顯示
    const items = internal.items.filter(it => it.code === code);
    if(!items.length) continue;
    const count = items.length;
    let totalCost;
    if(OTHER_UNIT_COST[code] !== undefined){
      totalCost = OTHER_UNIT_COST[code] * count;
    } else {
      totalCost = items.reduce((s,it)=>s+(+it.amount||0), 0);
    }
    out.push({code, count, totalCost, hint: NON_LAB_HINTS[code]});
  }
  return out;
}

const SLOT_DEFAULTS = {
  central:  {name:'尚未上傳', status:'中央健保申報明細.XLS'},
  billing:  {name:'尚未上傳', status:'客戶對帳單明細.XLS'},
  internal: {name:'尚未上傳', status:'常誠EN220交付檢驗統計表.XLS'},
};
function setSlot(type, name, status, isErr){
  const el = document.getElementById('slot-'+type);
  if(!el) return;
  el.classList.remove('done','error');
  el.classList.add(isErr?'error':'done');
  el.querySelector('.name').textContent = name;
  el.querySelector('.status').textContent = status;
  const icon = el.querySelector('.slot-icon');
  if(icon) icon.textContent = isErr ? '❌' : '✅';
}
function resetSlot(type){
  const el = document.getElementById('slot-'+type);
  if(!el) return;
  el.classList.remove('done','error');
  const d = SLOT_DEFAULTS[type] || {name:'尚未上傳', status:''};
  el.querySelector('.name').textContent = d.name;
  el.querySelector('.status').textContent = d.status;
  const icon = el.querySelector('.slot-icon');
  if(icon) icon.textContent = '📂';
}
function checkReady(){
  return STATE.central && STATE.billing && STATE.internal;
}

async function readWorkbook(file){
  const buf = await file.arrayBuffer();
  return XLSX.read(buf, {type:'array', cellDates:false});
}
async function handleFiles(files, hintType){
  for(const file of files){
    try {
      const wb = await readWorkbook(file);
      let type = detectFileType(wb);
      /* 若自動辨識失敗，退回使用者拖入的格子類型 */
      if(type === 'unknown' && hintType) type = hintType;
      if(type==='central'){
        STATE.central = parseCentral(wb.Sheets[wb.SheetNames[0]]);
        if(STATE.central.month) STATE.month = STATE.central.month;
        setSlot('central', file.name, `✓ ${STATE.central.items.length} 筆檢驗、${STATE.central.dailySubs.length} 個工作日`);
      } else if(type==='billing'){
        STATE.billing = parseBilling(wb.Sheets[wb.SheetNames[0]]);
        setSlot('billing', file.name, `✓ ${STATE.billing.visits.length} 筆訪視、應收 $${fmt(STATE.billing.total)}`);
      } else if(type==='internal'){
        STATE.internal = parseInternal(wb.Sheets[wb.SheetNames[0]]);
        const aliasN = STATE.internal.items.filter(x=>x.code !== x.rawCode).length;
        setSlot('internal', file.name, `✓ ${STATE.internal.items.length} 筆紀錄${aliasN?`（${aliasN} 筆短碼→長碼正規化）`:''}`);
      } else {
        if(hintType){
          setSlot(hintType, file.name, '無法辨識為'+(hintType==='central'?'中央健保申報明細':hintType==='billing'?'客戶對帳單':'常誠檢驗交付表')+'格式 — 請確認檔案內容', true);
        } else {
          alert(`無法辨識檔案類型：${file.name}\n請確認是央保、客戶帳單、或交付檢驗統計表`);
        }
      }
    } catch(e){
      alert(`讀取失敗：${file.name}\n${e.message}`);
    }
  }
  /* 3 份齊全 → 自動產製 + 校對 */
  if(checkReady()) processData();
}

    html += `<tr>
      <td class="code-cell">${it.code}</td><td class="code-cell">${it.code}</td><td>${it.name}</td>
      <td class="num-cell">${fmt(it.decl)}</td><td class="num-cell">${fmt(it.cost)}</td>
      <td class="num-cell">${fmt(it.qty)}</td><td class="num-cell"${SP[it.code]?' style="color:#6a1b9a;font-weight:700"':''}>${fmt(SP[it.code]||0)}</td>
      <td class="num-cell">${fmt(it.declTotal)}</td><td class="num-cell">${fmt(it.costTotal)}</td><td class="num-cell">${fmt(it.net)}</td>
    </tr>`;
  }
  html += `<tr class="total"><td colspan="5" style="text-align:right">總計：</td>
    <td class="num-cell">${fmt(sQ)}</td><td class="num-cell">${fmt(SPtotal)}</td>
    <td class="num-cell">${fmt(sH)}</td><td class="num-cell">${fmt(sI)}</td><td class="num-cell">${fmt(sJ)}</td>
  </tr>`;
  html += `</tbody>`;
  t.innerHTML = html;

  /* 其他對帳表項目（不混入檢驗總表） */
  renderOtherTable();

  /* Verify section（v1.4.0：用已排除行動醫院日的視圖校對） */
  const F = STATE.filtered || STATE;
  const v = runVerification(F.central, F.billing, F.internal, STATE.aggCache);
  const vEl = document.getElementById('verifyResult');
  const errs = v.issues.filter(i=>i.level==='error');
  const warns = v.issues.filter(i=>i.level==='warn');
  const infos = v.issues.filter(i=>i.level==='info');
  let vHtml = '';
  /* 一句話總結（白話）：紅色才是真的要處理；只有黃色代表金額都對、只是提醒 */
  if(!v.issues.length && !v.passes.length){
    vHtml = `<div class="verdict ok">尚無可檢查的資料</div>`;
  } else if(errs.length > 0){
    vHtml += `<div class="verdict bad">❌ 有 ${errs.length} 項要處理（紅色）${warns.length?`，另有 ${warns.length} 項提醒`:''}</div>`;
  } else if(warns.length > 0){
    vHtml += `<div class="verdict note">⚠️ 金額都對；有 ${warns.length} 項提醒（多半是自費或對你有利），確認一下即可</div>`;
  } else {
    vHtml += `<div class="verdict ok">✅ 全部符合 —— 這個月對帳沒問題</div>`;
  }
  /* 未符合擺最前（紅＝要處理；黃＝對你有利但提醒）*/
  for(const it of errs){
    vHtml += `<div class="issue error"><span class="lvl">❌ 未符合</span><span class="cat">${it.cat}</span><span class="msg">${it.msg}</span></div>`;
  }
  for(const it of warns){
    vHtml += `<div class="issue warn"><span class="lvl">⚠️ 注意</span><span class="cat">${it.cat}</span><span class="msg">${it.msg}</span></div>`;
  }
  /* 符合 */
  for(const p of v.passes){
    vHtml += `<div class="pass">✅ 符合 — ${p}</div>`;
  }
  /* 參考（不是對錯，純提醒）*/
  for(const it of infos){
    vHtml += `<div class="issue info"><span class="lvl">ℹ️ 參考</span><span class="cat">${it.cat}</span><span class="msg">${it.msg}</span></div>`;
  }
  vEl.innerHTML = vHtml;

  /* Download button label */
  document.getElementById('downloadBtn').textContent = `📥 下載 檢驗總表-${STATE.month||'YYYMM'}.xlsx`;
  sec.scrollIntoView({behavior:'smooth',block:'start'});
}

function processData(){
  if(!STATE.central){ alert('缺少 央保申報對單'); return; }
  STATE.filtered = buildFilteredData();   // v1.4.0：套用行動醫院日排除
  STATE.aggCache = aggregateByCode(STATE.filtered.central.items);
  STATE.selfPay = computeSelfPay(STATE.filtered.central, STATE.filtered.billing);  // v1.4.4 自費歸戶
  STATE.summary = buildSummary(STATE.aggCache, STATE.selfPay);
  if(!STATE.month) STATE.month = '11500';
  renderResult();
}
/* downloadXlsx 已在 generateXlsxStyled 區塊內定義（v1.3.0 ExcelJS 美化版） */

/* Reset */
function resetAll(){
  STATE.central = STATE.billing = STATE.internal = STATE.summary = STATE.month = STATE.aggCache = STATE.filtered = null;
  STATE.mobileDates = new Set();
  ['central','billing','internal'].forEach(t => {
    resetSlot(t);
    const inp = document.querySelector(`#slot-${t} input[type="file"]`);
    if(inp) inp.value = '';
  });
  const mdb = document.getElementById('mobileDateBox');
  if(mdb){ mdb.classList.add('hidden'); mdb.innerHTML=''; }
  document.getElementById('resultSection').classList.add('hidden');
}

/* Wire up events */
document.addEventListener('DOMContentLoaded', () => {
  /* 3 個 slot 各自綁定拖放 + 點擊上傳 */
  ['central','billing','internal'].forEach(type => {
    const slot = document.getElementById('slot-'+type);
    const inp  = slot.querySelector('input[type="file"]');
    inp.addEventListener('change', e => {
      handleFiles(e.target.files, type);
      e.target.value = '';   /* 允許重新上傳同名檔 */
    });
    ['dragenter','dragover'].forEach(ev => slot.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      slot.classList.add('drag');
    }));
    ['dragleave','drop'].forEach(ev => slot.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      slot.classList.remove('drag');
    }));
    slot.addEventListener('drop', e => {
      handleFiles(e.dataTransfer.files, type);
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', downloadXlsx);
  document.getElementById('resetBtn').addEventListener('click', resetAll);

  /* v1.4.0：行動醫院日 — 點日期鈕切換排除，即時重算（事件委派） */
  document.getElementById('mobileDateBox').addEventListener('click', e => {
    const btn = e.target.closest('.mdchip');
    if(!btn) return;
    const d = btn.dataset.date;
    if(STATE.mobileDates.has(d)) STATE.mobileDates.delete(d);
    else STATE.mobileDates.add(d);
    processData();
  });
});
</script>
