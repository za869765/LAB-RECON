.slot:hover,.slot.drag{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.slot input{display:none}
.slot.t-central{border-color:#81d4fa;background:#f3fbfe}
.slot.t-central:hover,.slot.t-central.drag{border-color:#0277bd;background:#e1f5fe}
.slot.t-billing{border-color:#ffcc80;background:#fff8f0}
.slot.t-billing:hover,.slot.t-billing.drag{border-color:#ef6c00;background:#fff3e0}
.slot.t-internal{border-color:#ce93d8;background:#fbf6fd}

.slot.error{border-style:solid;border-color:#e53935;background:#ffebee}

.slot.error .slot-icon{color:#c62828}
.slot .name{font-size:12px;color:#37474f;word-break:break-all;font-weight:600;margin-top:4px}
.slot .status{font-size:11px;margin-top:6px;color:#78909c;line-height:1.5}
.slot.done .status{color:#2e7d32;font-weight:600}
.slot.error .status{color:#c62828;font-weight:600}
.slot .pick-hint{font-size:11px;color:#90a4ae;margin-top:6px}
.slot.done .pick-hint, .slot.error .pick-hint{display:none}
.btn{padding:10px 20px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#1565c0;color:#fff}
.btn-primary:hover{background:#0d47a1}
.btn-primary:disabled{background:#b0bec5;cursor:not-allowed}
.btn-success{background:#2e7d32;color:#fff}

.btn-ghost{background:#fff;color:#546e7a;border:1px solid #cfd8dc}

<header>

  <span class="ver">v1.2.0</span>

      <input type="file" data-type="central" accept=".xls,.xlsx,.XLS,.XLSX">
    </label>
    <label class="slot t-billing" id="slot-billing">
      <span class="tag billing slot-tag">②客戶對帳單</span>
      <div class="slot-icon">📂</div>
      <div class="name">尚未上傳</div>
      <div class="status">客戶對帳單明細.XLS</div>

      <input type="file" data-type="billing" accept=".xls,.xlsx,.XLS,.XLSX">
    </label>
    <label class="slot t-internal" id="slot-internal">

  </div>
  <div class="actions" style="margin-top:14px">
    <button class="btn btn-ghost" id="resetBtn">↺ 全部重來</button>
  </div>
  <div class="notes">

  </div>
</section>

<section id="resultSection" class="hidden">
  <div class="sec-hd"><span class="num">2</span>結果（即時更新）</div>
  <div class="summary-bar" id="summaryBar"></div>

</main>

/* ═══════════════════════════════════════════════════════
   檔案類型偵測
═══════════════════════════════════════════════════════ */
function detectFileType(workbook){
  const ws = workbook.Sheets[workbook.SheetNames[0]];
  const a1 = String((ws['A1']||{}).v||'');
  if (a1.includes('中央健保申報')) return 'central';
  if (a1.includes('客戶帳單明細'))  return 'billing';
  if (a1 === '筆數' || (ws['A1']&&ws['A1'].v==='筆數')) return 'internal';
  /* 退路：檢查欄位 */
  const headers = [];
  for(let c=1;c<=12;c++){
    const cell = ws[XLSX.utils.encode_cell({r:0,c:c-1})];
    if(cell) headers.push(String(cell.v||''));
  }
  const hStr = headers.join('|');
  if (hStr.includes('健保代號')||hStr.includes('檢驗名稱')) return 'internal';
  if (hStr.includes('檢體編號')||hStr.includes('健保價格')) return 'central';
  return 'unknown';
}

/* ═══════════════════════════════════════════════════════
   解析：央保申報對單
═══════════════════════════════════════════════════════ */
function parseCentral(ws){
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});
  const items=[],dailySubs=[];
  let total={cost:0,decl:0},month=null,clinic=null,curDate=null,inSection=false;
  for(const r of rows){
    if(!r||!r.length) continue;
    const a=String(r[0]||'').trim(), e=String(r[4]||'').trim();
    /* 第一列「客戶簡稱: 臺南市佳里區衛生所」 */
    if(a.startsWith('客戶簡稱')){
      const m=a.match(/客戶簡稱:\s*(.+)/);
      if(m) clinic=m[1].trim();
      continue;
    }
    if(a.startsWith('單據日期:')){
      curDate=a.replace('單據日期:','').trim();
      if(!month){
        const m=curDate.match(/^(\d+)\/(\d+)\/\d+/);
        if(m) month=m[1]+m[2].padStart(2,'0');
      }
      inSection=false; continue;
    }
    if(a==='檢體編號'){ inSection=true; continue; }
    if(e==='每日小計:'){ dailySubs.push({date:curDate,cost:+r[5]||0,decl:+r[6]||0}); inSection=false; continue; }
    if(e==='客戶統計:'){ total={cost:+r[5]||0,decl:+r[6]||0}; continue; }
    if(inSection&&a){
      const sub=String(r[4]||'').trim(), big=String(r[3]||'').trim();
      let code=null;
      if(sub==='單價'){
        const m=big.match(/\(([A-Z]\d{4}[A-Z])\)/);
        if(m) code=m[1];
        else if(big==='尿液常規檢查') code='06012C';
        else if(big==='血液常規檢查') code='08011C';
        else if(big.includes('成人預防保健')) code='21013C';
      } else {
        code = NAME_TO_CODE[sub] || null;
      }
      items.push({date:curDate,sn:r[0],name:r[1],id:r[2],big,sub,cost:+r[5]||0,decl:+r[6]||0,code});
    }
  }
  return {items,dailySubs,total,month};
}

/* ═══════════════════════════════════════════════════════
   解析：客戶帳單明細
═══════════════════════════════════════════════════════ */
function parseBilling(ws){
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});
  let total=0;
  const visits=[]; let cur=null;
  for(const r of rows){
    if(!r||!r.length) continue;
    const a=String(r[0]||'').trim(), b=String(r[1]||'').trim();
    /* R2 第二格是金額 */
    if(a.startsWith('應收金額')){ total = +r[1]||0; continue; }
    if(/^\d+\/\d+\/\d+/.test(a)){
      cur={date:a,name:r[1],id:r[2],idLong:r[3],amount:+r[4]||0,itemsText:''};
      visits.push(cur);
    } else if(cur && b && !a){
      cur.itemsText = b;
    }
  }
  return {total,visits};
}

/* ═══════════════════════════════════════════════════════
   解析：內部統計表 (11504.xlsx 交付檢驗統計表)
═══════════════════════════════════════════════════════ */
function parseInternal(ws){
  const rows = XLSX.utils.sheet_to_json(ws,{defval:null,raw:false});
  const items = rows
    .filter(r=>r['健保代號']&&r['檢驗名稱'])
    .map(r=>{
      const raw = String(r['健保代號']).trim();
      /* v1.0.1：短碼自動正規化成央保長碼，避免「21 vs 21013C」誤判 */
      const code = INTERNAL_CODE_ALIASES[raw] || raw;
      return {
        seq:r['筆數'],mrn:r['病歷號'],name:r['姓名'],
        code, rawCode: raw,
        testName:r['檢驗名稱'],
        visitNo:r['就醫序號'],date:r['就醫日期'],
        qty:+(r['次數']||1),
        price:+(r['健保單價']||0),
        amount:+(r['小計']||0),
        doctor:r['醫師'],
      };
    });
  return {items};
}

/* ═══════════════════════════════════════════════════════
   聚合 + 產製 檢驗總表
═══════════════════════════════════════════════════════ */
function aggregateByCode(centralItems){
  const agg = new Map();
  for(const it of centralItems){
    if(!it.code) continue;
    if(!agg.has(it.code)) agg.set(it.code,{code:it.code,qty:0,costSum:0,declSum:0,prices:new Set(),examples:[]});
    const a = agg.get(it.code);
    a.qty++;
    a.costSum += it.cost;
    a.declSum += it.decl;
    a.prices.add(`${it.cost}/${it.decl}`);
    a.examples.push(it);
  }
  return agg;
}
function buildSummary(agg){
  const items=[];
  const codes=[...agg.keys()].sort((a,b)=>{
    const aN=/^\d/.test(a), bN=/^\d/.test(b);
    if(aN!==bN) return aN?-1:1;
    return a.localeCompare(b);
  });
  for(const code of codes){
    const a = agg.get(code);
    const decl = a.qty>0 ? Math.round(a.declSum/a.qty) : 0;
    const cost = a.qty>0 ? Math.round(a.costSum/a.qty) : 0;
    items.push({
      code, name: CODE_TO_NAME[code] || code,
      decl, cost, qty: a.qty,
      declTotal: a.declSum, costTotal: a.costSum,
      net: a.declSum - a.costSum,
    });
  }
  return items;
}

/* ═══════════════════════════════════════════════════════
   校對：6 項檢查
═══════════════════════════════════════════════════════ */
function runVerification(central, billing, internal, agg){
  const issues = [];
  const passes = [];

  /* 1. 央保 客戶統計 = 每日小計 加總 */
  const dCost = central.dailySubs.reduce((s,d)=>s+d.cost,0);
  const dDecl = central.dailySubs.reduce((s,d)=>s+d.decl,0);
  const okC = Math.abs(dCost - central.total.cost)<.5;
  const okD = Math.abs(dDecl - central.total.decl)<.5;
  if(okC && okD) passes.push(`央保 客戶統計 = 每日小計加總 ✓ (標準=${central.total.cost} 健保=${central.total.decl})`);
  if(!okC) issues.push({level:'error',cat:'央保自身對帳',msg:`客戶統計標準價=${central.total.cost} 但每日小計加總=${dCost}（差 ${central.total.cost-dCost}）`});
  if(!okD) issues.push({level:'error',cat:'央保自身對帳',msg:`客戶統計健保價=${central.total.decl} 但每日小計加總=${dDecl}（差 ${central.total.decl-dDecl}）`});

  /* 2. 央保 每日小計 = 該日逐筆加總 */
  const byDate = new Map();
  for(const it of central.items){
    if(!byDate.has(it.date)) byDate.set(it.date,{cost:0,decl:0,n:0});
    const d=byDate.get(it.date);
    d.cost+=it.cost; d.decl+=it.decl; d.n++;
  }
  let dailyOk = true;
  for(const sub of central.dailySubs){
    const d = byDate.get(sub.date) || {cost:0,decl:0};
    if(Math.abs(d.cost-sub.cost)>.5){
      issues.push({level:'error',cat:'央保每日小計',msg:`${sub.date} 標準價小計=${sub.cost} 但逐筆加總=${d.cost}（差 ${sub.cost-d.cost}）`});
      dailyOk=false;
    }
    if(Math.abs(d.decl-sub.decl)>.5){
      issues.push({level:'error',cat:'央保每日小計',msg:`${sub.date} 健保價小計=${sub.decl} 但逐筆加總=${d.decl}（差 ${sub.decl-d.decl}）`});
      dailyOk=false;
    }
  }
  if(dailyOk) passes.push(`央保 每日小計 = 該日逐筆加總 ✓ (${central.dailySubs.length} 個工作日)`);

  /* 3. 客戶帳單應收金額 = 央保客戶統計（標準價） */
  if(billing){
    if(Math.abs(billing.total - central.total.cost)<.5){
      passes.push(`客戶帳單應收金額 = 央保客戶統計標準價 ✓ ($${billing.total})`);
    } else {
      issues.push({level:'error',cat:'帳單 vs 央保',msg:`客戶帳單應收金額=${billing.total} 但央保客戶統計（標準價）=${central.total.cost}（差 ${billing.total-central.total.cost}）`});
    }
    /* 4. 客戶帳單 visits 加總 */
    const visitSum = billing.visits.reduce((s,v)=>s+v.amount,0);
    if(Math.abs(visitSum - billing.total)<.5){
      passes.push(`客戶帳單 各筆加總 = 應收金額 ✓ (${billing.visits.length} 筆訪客)`);
    } else {
      issues.push({level:'warn',cat:'客戶帳單',msg:`各筆加總=${visitSum} ≠ 應收金額=${billing.total}（差 ${billing.total-visitSum}）`});
    }
  }

  /* 5. 央保 vs 內部：每代碼數量比對 */
  if(internal){
    const intCount = new Map();
    for(const it of internal.items){
      intCount.set(it.code, (intCount.get(it.code)||0) + (it.qty||1));
    }
    const cenCount = new Map();
    for(const it of central.items){
      if(it.code) cenCount.set(it.code, (cenCount.get(it.code)||0)+1);
    }
    const allCodes = new Set([...intCount.keys(), ...cenCount.keys()]);
    let qtyOk = true;
    for(const code of allCodes){
      const c = cenCount.get(code)||0;
      const i = intCount.get(code)||0;
      if(c === i) continue;
      qtyOk=false;
      const name = CODE_TO_NAME[code] || code;
      if(c > i){
        /* 廠商多算 — 紅色嚴重 */
        issues.push({level:'error',cat:'廠商多算',msg:`${code}（${name}）：央保=${c} 筆，內部=${i} 筆，廠商多算 ${c-i} 筆 — 請查證`});
      } else if(i > 0 && c === 0){
        /* 內部有但央保沒收 — 已知代碼不重複報，移到下方「其他項目」獨立區塊；未知代碼才提示 */
        if(NON_LAB_HINTS[code]) continue;
        issues.push({level:'info',cat:'其他對帳表',msg:`${code}（${name}）：內部=${i} 筆，本表=0 — 不在此對帳表內，請確認屬其他對帳表或其他單位`});
      } else {
        /* 廠商漏算（內部多） — 黃色警示，對你有利但仍提醒 */
        issues.push({level:'warn',cat:'廠商漏算',msg:`${code}（${name}）：央保=${c} 筆，內部=${i} 筆，廠商少算 ${i-c} 筆（你少付）— 請確認`});
      }
    }
    if(qtyOk) passes.push(`央保 vs 內部 各代碼數量完全一致 ✓`);
  }

  /* 6. 單價跑掉檢查（同月內不同筆出現不同價格）*/
  let priceOk = true;
  for(const [code,a] of agg){
    if(a.prices.size > 1){
      issues.push({level:'error',cat:'單價跑掉',msg:`${code}（${CODE_TO_NAME[code]||code}）：央保出現 ${a.prices.size} 種價格 ${[...a.prices].join(' / ')} — 標準/健保價應一致`});
      priceOk=false;
    }
  }
  if(priceOk) passes.push(`央保各項目單價（同項皆一致）✓`);

  /* 7. 契約標準價格 校對 — 每項 央保價 vs 115 年度合約標準 */
  let stdOk = true;
  let stdNotInTable = [];
  for(const [code,a] of agg){
    /* 央保的價（每筆都一樣才會走到這） */
    const sample = a.examples[0];
    const cCost = sample.cost;     // 廠商申報之檢驗項目單價（成本）
    const cDecl = sample.decl;     // 健保支付點數
    const std = STANDARD_PRICES[code];
    if(!std){
      stdNotInTable.push(code);
      continue;
    }
    const costDiff = cCost - std.cost;
    const declDiff = cDecl - std.decl;
    if(costDiff !== 0 || declDiff !== 0){
      const parts = [];
      if(declDiff !== 0) parts.push(`健保支付點數 ${cDecl} vs 標準 ${std.decl}（差 ${declDiff>0?'+':''}${declDiff}）`);
      if(costDiff !== 0) parts.push(`廠商申報單價 ${cCost} vs 標準 ${std.cost}（差 ${costDiff>0?'+':''}${costDiff}）`);
      const lvl = (costDiff > 0) ? 'error' : 'warn';   /* 廠商收高 = 紅；收低 = 黃 */
      const tag = (costDiff > 0) ? '廠商超收' : '廠商低收';
      issues.push({level:lvl,cat:`契約價校對 / ${tag}`,msg:`${code}（${CODE_TO_NAME[code]||std.name}）：${parts.join('；')}`});
      stdOk = false;
    }
  }
  if(stdNotInTable.length){
    issues.push({level:'info',cat:'契約價校對',msg:`未列在標準價表的代碼：${stdNotInTable.join('、')} — 無契約標準可比對`});
  }
  if(stdOk && stdNotInTable.length===0){
    passes.push(`所有項目價格皆符合 115 年度契約標準 ✓`);
  } else if(stdOk){
    passes.push(`契約標準表內項目價格皆符合 ✓（${stdNotInTable.length} 項無標準可比）`);
  }

  return {issues, passes};
}

/* ═══════════════════════════════════════════════════════
   產出 xlsx
═══════════════════════════════════════════════════════ */
function generateXlsx(month, summary){
  const wb = XLSX.utils.book_new();
  const yyy = month.slice(0,3), mm = parseInt(month.slice(3));
  const aoa = [];
  aoa.push([null,'臺南市佳里區衛生所',null,null,null,null,null,null,null,null]);
  aoa.push([null,'檢驗總表',null,null,null,null,null,null,null,null]);
  aoa.push([null,`${yyy}${String(mm).padStart(2,'0')}01 至 ${yyy}${String(mm).padStart(2,'0')}30`,null,null,null,null,null,null,null,null]);
  aoa.push(['檢驗代碼','申報代碼','檢驗名稱','申報額','單價','數量','自費額','申報總額','成本總額','淨付額']);
  let firstDataRow = aoa.length + 1;
  for(const it of summary){
    aoa.push([it.code, it.code, it.name, it.decl, it.cost, it.qty, 0, it.declTotal, it.costTotal, it.net]);
  }
  let lastDataRow = aoa.length;
  /* 總計列 — 用 Excel 公式 */
  aoa.push([
    null, null, '總計：', null, null,
    {f:`SUM(F${firstDataRow}:F${lastDataRow})`},
    {f:`SUM(G${firstDataRow}:G${lastDataRow})`},
    {f:`SUM(H${firstDataRow}:H${lastDataRow})`},
    {f:`SUM(I${firstDataRow}:I${lastDataRow})`},
    {f:`SUM(J${firstDataRow}:J${lastDataRow})`},
  ]);
  aoa.push([null,null,null,null,null,null,null,null,null,null]);
  aoa.push([null,'製表人：',null,null,'所長',null,null,null,null,null]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  /* H/I/J 也用公式更動態 */
  for(let i=0;i<summary.length;i++){
    const r = firstDataRow + i;
    ws[`H${r}`] = {f:`D${r}*F${r}`, t:'n'};
    ws[`I${r}`] = {f:`E${r}*F${r}`, t:'n'};
    ws[`J${r}`] = {f:`H${r}-I${r}`, t:'n'};
  }
  /* 欄寬 */
  ws['!cols'] = [
    {wch:10},{wch:10},{wch:32},{wch:8},{wch:8},{wch:6},{wch:8},{wch:11},{wch:11},{wch:11}
  ];
  XLSX.utils.book_append_sheet(wb, ws, '工作表1');
  return wb;
}

function fmt(n){
  if(n==null||isNaN(n)) return '-';
  return Math.round(n).toLocaleString('zh-TW');
}

/* v1.2.0：其他對帳表項目（85/3F 同廠商不同申報、E4004C 不同廠商僅費用） */
function buildOtherTableSummary(){
  if(!STATE.internal) return [];
  const out = [];
  for(const code of Object.keys(NON_LAB_HINTS)){
    const items = STATE.internal.items.filter(it => it.code === code);
    if(!items.length) continue;
    const count = items.length;
    let totalCost;
    if(OTHER_UNIT_COST[code] !== undefined){
      totalCost = OTHER_UNIT_COST[code] * count;
    } else {
      totalCost = items.reduce((s,it)=>s+(+it.amount||0), 0);
    }
    out.push({code, count, totalCost, hint: NON_LAB_HINTS[code]});
  }
  return out;
}
function renderOtherTable(){
  const box = document.getElementById('otherTableBox');
  if(!box) return;
  const items = buildOtherTableSummary();
  if(!items.length){
    box.innerHTML = '<span style="color:#90a4ae;font-size:11px;">本月無其他對帳表項目</span>';
    return;
  }
  const total = items.reduce((s,i)=>s+i.totalCost,0);
  let html = '<div style="display:flex;flex-direction:column;gap:6px">';

    html += `<div style="display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px dashed #e1bee7;">
      <span><b style="font-family:Consolas,monospace;color:#6a1b9a;">${it.code}</b>　<span style="color:#546e7a;font-size:11px;">${it.hint}</span></span>

    <span>合計</span><span style="font-variant-numeric:tabular-nums;">$${fmt(total)}</span>
  </div></div>`;
  box.innerHTML = html;
}
const SLOT_DEFAULTS = {
  central:  {name:'尚未上傳', status:'中央健保申報明細.XLS'},
  billing:  {name:'尚未上傳', status:'客戶對帳單明細.XLS'},
  internal: {name:'尚未上傳', status:'常誠EN220交付檢驗統計表.XLS'},
};
function setSlot(type, name, status, isErr){
  const el = document.getElementById('slot-'+type);
  if(!el) return;
  el.classList.remove('done','error');
  el.classList.add(isErr?'error':'done');
  el.querySelector('.name').textContent = name;
  el.querySelector('.status').textContent = status;
  const icon = el.querySelector('.slot-icon');
  if(icon) icon.textContent = isErr ? '❌' : '✅';
}
function resetSlot(type){
  const el = document.getElementById('slot-'+type);
  if(!el) return;
  el.classList.remove('done','error');
  const d = SLOT_DEFAULTS[type] || {name:'尚未上傳', status:''};
  el.querySelector('.name').textContent = d.name;
  el.querySelector('.status').textContent = d.status;
  const icon = el.querySelector('.slot-icon');
  if(icon) icon.textContent = '📂';
}
function checkReady(){
  return STATE.central && STATE.billing && STATE.internal;
}

async function readWorkbook(file){
  const buf = await file.arrayBuffer();
  return XLSX.read(buf, {type:'array', cellDates:false});
}
async function handleFiles(files, hintType){
  for(const file of files){
    try {
      const wb = await readWorkbook(file);
      let type = detectFileType(wb);
      /* 若自動辨識失敗，退回使用者拖入的格子類型 */
      if(type === 'unknown' && hintType) type = hintType;
      if(type==='central'){
        STATE.central = parseCentral(wb.Sheets[wb.SheetNames[0]]);
        if(STATE.central.month) STATE.month = STATE.central.month;
        setSlot('central', file.name, `✓ ${STATE.central.items.length} 筆檢驗、${STATE.central.dailySubs.length} 個工作日`);
      } else if(type==='billing'){
        STATE.billing = parseBilling(wb.Sheets[wb.SheetNames[0]]);
        setSlot('billing', file.name, `✓ ${STATE.billing.visits.length} 筆訪視、應收 $${fmt(STATE.billing.total)}`);
      } else if(type==='internal'){
        STATE.internal = parseInternal(wb.Sheets[wb.SheetNames[0]]);
        const aliasN = STATE.internal.items.filter(x=>x.code !== x.rawCode).length;
        setSlot('internal', file.name, `✓ ${STATE.internal.items.length} 筆紀錄${aliasN?`（${aliasN} 筆短碼→長碼正規化）`:''}`);
      } else {
        if(hintType){
          setSlot(hintType, file.name, '無法辨識為'+(hintType==='central'?'中央健保申報明細':hintType==='billing'?'客戶對帳單':'常誠檢驗交付表')+'格式 — 請確認檔案內容', true);
        } else {
          alert(`無法辨識檔案類型：${file.name}\n請確認是央保、客戶帳單、或交付檢驗統計表`);
        }
      }
    } catch(e){
      alert(`讀取失敗：${file.name}\n${e.message}`);
    }
  }
  /* 3 份齊全 → 自動產製 + 校對 */
  if(checkReady()) processData();
}

  for(const it of STATE.summary){
    html += `<tr>
      <td class="code-cell">${it.code}</td><td class="code-cell">${it.code}</td><td>${it.name}</td>
      <td class="num-cell">${fmt(it.decl)}</td><td class="num-cell">${fmt(it.cost)}</td>
      <td class="num-cell">${fmt(it.qty)}</td><td class="num-cell">0</td>
      <td class="num-cell">${fmt(it.declTotal)}</td><td class="num-cell">${fmt(it.costTotal)}</td><td class="num-cell">${fmt(it.net)}</td>
    </tr>`;
  }
  html += `<tr class="total"><td colspan="5" style="text-align:right">總計：</td>
    <td class="num-cell">${fmt(sQ)}</td><td class="num-cell">0</td>
    <td class="num-cell">${fmt(sH)}</td><td class="num-cell">${fmt(sI)}</td><td class="num-cell">${fmt(sJ)}</td>
  </tr>`;
  html += `</tbody>`;
  t.innerHTML = html;

  /* 其他對帳表項目（不混入檢驗總表） */
  renderOtherTable();

  /* Verify section */
  const v = runVerification(STATE.central, STATE.billing, STATE.internal, STATE.aggCache);
  const vEl = document.getElementById('verifyResult');
  let vHtml = '';
  /* 通過項目 */
  for(const p of v.passes){
    vHtml += `<div class="pass">🟢 ${p}</div>`;
  }
  /* 嚴重 */
  const errs = v.issues.filter(i=>i.level==='error');
  const warns = v.issues.filter(i=>i.level==='warn');
  const infos = v.issues.filter(i=>i.level==='info');
  for(const it of errs){
    vHtml += `<div class="issue error"><span class="lvl">🔴 嚴重</span><span class="cat">${it.cat}</span><span class="msg">${it.msg}</span></div>`;
  }
  for(const it of warns){
    vHtml += `<div class="issue warn"><span class="lvl">🟡 警示</span><span class="cat">${it.cat}</span><span class="msg">${it.msg}</span></div>`;
  }
  for(const it of infos){
    vHtml += `<div class="issue info"><span class="lvl">🔵 資訊</span><span class="cat">${it.cat}</span><span class="msg">${it.msg}</span></div>`;
  }
  if(!v.issues.length && !v.passes.length){
    vHtml = `<div class="pass">無檢查資料</div>`;
  }
  vEl.innerHTML = vHtml;

  /* Download button label */
  document.getElementById('downloadBtn').textContent = `📥 下載 檢驗總表-${STATE.month||'YYYMM'}.xlsx`;
  sec.scrollIntoView({behavior:'smooth',block:'start'});
}

function processData(){
  if(!STATE.central){ alert('缺少 央保申報對單'); return; }
  STATE.aggCache = aggregateByCode(STATE.central.items);
  STATE.summary = buildSummary(STATE.aggCache);
  if(!STATE.month) STATE.month = '11500';
  renderResult();
}
function downloadXlsx(){
  if(!STATE.summary){ alert('請先產製'); return; }
  const wb = generateXlsx(STATE.month, STATE.summary);
  XLSX.writeFile(wb, `檢驗總表-${STATE.month}.xlsx`);
}

/* Reset */
function resetAll(){
  STATE.central = STATE.billing = STATE.internal = STATE.summary = STATE.month = STATE.aggCache = null;
  ['central','billing','internal'].forEach(t => {
    resetSlot(t);
    const inp = document.querySelector(`#slot-${t} input[type="file"]`);
    if(inp) inp.value = '';
  });
  document.getElementById('resultSection').classList.add('hidden');
}

/* Wire up events */
document.addEventListener('DOMContentLoaded', () => {
  /* 3 個 slot 各自綁定拖放 + 點擊上傳 */
  ['central','billing','internal'].forEach(type => {
    const slot = document.getElementById('slot-'+type);
    const inp  = slot.querySelector('input[type="file"]');
    inp.addEventListener('change', e => {
      handleFiles(e.target.files, type);
      e.target.value = '';   /* 允許重新上傳同名檔 */
    });
    ['dragenter','dragover'].forEach(ev => slot.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      slot.classList.add('drag');
    }));
    ['dragleave','drop'].forEach(ev => slot.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      slot.classList.remove('drag');
    }));
    slot.addEventListener('drop', e => {
      handleFiles(e.dataTransfer.files, type);
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', downloadXlsx);
  document.getElementById('resetBtn').addEventListener('click', resetAll);
});
</script>
</body>
</html>
